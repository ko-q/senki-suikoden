name: WebKit iPhone smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  webkit-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Playwright WebKit
        run: |
          npm init -y
          npm install playwright@1.57.0
          npx playwright install --with-deps webkit

      - name: Test public game with iPhone-sized WebKit
        id: smoke
        continue-on-error: true
        run: |
          cat > smoke.cjs <<'EOF'
          const fs = require('fs');
          const { webkit, devices } = require('playwright');

          const PUBLIC_URL = 'https://ko-q.github.io/senki-suikoden/';

          (async () => {
            const pageErrors = [];
            const consoleErrors = [];
            const requestFailures = [];
            const localHtml = fs.readFileSync('index.html', 'utf8');
            const expectedTitleMatch = localHtml.match(/<title>([^<]+)<\/title>/i);
            if (!expectedTitleMatch) throw new Error('Local index.html title not found');
            const expectedTitle = expectedTitleMatch[1];

            const browser = await webkit.launch({ headless: true });
            const context = await browser.newContext({ ...devices['iPhone 15'] });
            const page = await context.newPage();

            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('requestfailed', request => {
              if (request.url().startsWith(PUBLIC_URL)) {
                requestFailures.push(`${request.url()} :: ${request.failure()?.errorText || 'failed'}`);
              }
            });

            let response = null;
            let publicTitle = '';
            const deployDeadline = Date.now() + 180000;
            do {
              response = await page.goto(PUBLIC_URL, { waitUntil: 'load', timeout: 120000 });
              if (!response || !response.ok()) {
                throw new Error(`HTTP status: ${response && response.status()}`);
              }
              publicTitle = await page.title();
              if (publicTitle === expectedTitle) break;
              await page.waitForTimeout(10000);
            } while (Date.now() < deployDeadline);

            if (publicTitle !== expectedTitle) {
              throw new Error(`GitHub Pages not updated: expected '${expectedTitle}', got '${publicTitle}'`);
            }

            // タイトル画面は1回目のタップで約6.77秒の導入演出を開始し、ready後の2回目で閉じる。
            const titleScreen = page.locator('#titleScreen');
            await titleScreen.tap();
            await page.locator('#titleScreen.ready').waitFor({ state: 'visible', timeout: 15000 });
            await titleScreen.tap();
            await titleScreen.waitFor({ state: 'hidden', timeout: 10000 });

            const stageButtons = page.locator('#stageList .stage-btn');
            await stageButtons.nth(8).waitFor({ state: 'visible', timeout: 10000 });
            const stageCount = await stageButtons.count();
            if (stageCount !== 9) throw new Error(`Stage buttons: ${stageCount}`);

            // localStorageがiOS系WebKit相当でも通常利用できることを確認。
            const storageOk = await page.evaluate(() => {
              const key = '__senki_webkit_smoke__';
              localStorage.setItem(key, 'ok');
              const ok = localStorage.getItem(key) === 'ok';
              localStorage.removeItem(key);
              return ok;
            });
            if (!storageOk) throw new Error('localStorage read/write failed');

            // 第3章をUIから選択。loadStage直後に盤面は生成され、その後イントロ会話→作戦条件へ進む。
            await stageButtons.nth(2).tap();
            await page.locator('#board.stage-three-map').waitFor({ state: 'attached', timeout: 15000 });

            const cellCount = await page.locator('#board .cell').count();
            if (cellCount !== 128) throw new Error(`Chapter 3 cell count: ${cellCount}`);

            const background = await page.evaluate(() => {
              const board = document.querySelector('#board');
              return board ? getComputedStyle(board, '::before').backgroundImage : '';
            });
            if (!background || background === 'none' || !background.includes('data:image/')) {
              throw new Error(`Chapter 3 background missing: ${String(background).slice(0, 120)}`);
            }

            // 第3章イントロ会話を通常UIで最後まで進める。
            for (let i = 0; i < 12; i++) {
              const next = page.locator('#dialogueNext');
              if (!(await next.isVisible())) break;
              await next.tap();
              await page.waitForTimeout(180);
            }

            const missionStart = page.locator('#missionStartButton');
            await missionStart.waitFor({ state: 'visible', timeout: 15000 });
            await missionStart.tap();
            await missionStart.waitFor({ state: 'hidden', timeout: 10000 });

            await page.locator('#board').waitFor({ state: 'visible', timeout: 10000 });
            await page.screenshot({ path: 'webkit-iphone-stage3.png', fullPage: true });

            if (pageErrors.length) {
              throw new Error(`WebKit page errors:\n${pageErrors.join('\n')}`);
            }
            if (requestFailures.length) {
              throw new Error(`Same-origin request failures:\n${requestFailures.join('\n')}`);
            }

            console.log('PASS: WebKit iPhone smoke test');
            console.log(`Title: ${publicTitle}`);
            console.log(`Stage buttons: ${stageCount}`);
            console.log(`Chapter 3 cells: ${cellCount}`);
            console.log(`Chapter 3 background length: ${background.length}`);
            console.log(`localStorage: ${storageOk ? 'OK' : 'NG'}`);
            if (consoleErrors.length) {
              console.log(`Console errors observed (non-fatal): ${consoleErrors.join(' | ')}`);
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node smoke.cjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-iphone-stage3
          path: webkit-iphone-stage3.png
          if-no-files-found: ignore

      - name: Publish smoke result as commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          state=failure
          description="WebKit iPhone smoke test failed"
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            state=success
            description="WebKit iPhone smoke test passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="webkit-iphone-smoke" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail job when smoke test failed
        if: always() && steps.smoke.outcome != 'success'
        run: exit 1
